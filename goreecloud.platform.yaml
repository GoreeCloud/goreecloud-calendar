schema_version: "0.2"

component:
  type: application
  id: goreecloud-calendar
  product_name: GoreeCloud Calendar
  repository: GoreeCloud/goreecloud-calendar

lifecycle: development
version: "development-unversioned"

supported_platforms:
  - web

api:
  versions:
    - "v1"
  endpoints:
    - name: calendar-events
      url: /api/v1/events
      purpose: Authenticated Calendar event view and ETag-protected mutation contract; production publication is not approved.
    - name: calendar-busy-time
      url: /api/v1/busy-time
      purpose: Authenticated busy-time projection for an authorized Calendar collection.
    - name: tasks-busy-time
      url: /api/v1/tasks/busy-time
      purpose: Development-only least-privilege busy-time projection for the GoreeCloud Tasks peer application.

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: []
    notes: GoreeCloud Manager application registration, administration, observability, and operational acceptance have not been completed for Calendar.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - docs/product-foundation.md
      - goreecloud_calendar/observability.py
      - goreecloud_calendar/http.py
    notes: Privacy-minimizing source boundaries exist, including minimized busy-time projections and low-detail failures, but current Privacy Shield runtime integration and application acceptance have not been completed.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - goreecloud_calendar/security.py
      - goreecloud_calendar/session.py
      - goreecloud_calendar/credentials.py
      - docs/product-foundation.md
    notes: Source security controls exist, but current Wardveil Security integration, threat evidence, and application acceptance have not been completed.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - docs/product-foundation.md
    notes: Calendar recovery and portability obligations are documented, but current Everkeep backup, restore, rollback, and continuity acceptance have not been completed.
  glaze_ui:
    result: applicable-migration-required
    version: "1.3.0"
    evidence:
      - static/index.html
      - static/glaze.css
      - static/app.js
      - docs/product-foundation.md
    notes: Calendar contains a repository-local Glaze UI 1.3 web shell, but source labeling does not establish whole-application GLAZE UI V1.3 conformance. Fresh application-specific rendered, accessibility, responsive, representative-browser/device, Human Visual Excellence, rollback, release, and production acceptance remain required.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: GoreeCloud Mesh registration, capability publication, peer discovery, event integration, and runtime acceptance have not been completed for Calendar.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - goreecloud_calendar/session.py
      - goreecloud_calendar/auth.py
      - docs/product-foundation.md
    notes: Calendar has a server-derived session/authentication boundary, but accepted production GoreeCloud Identity service identity, user session, delegation, revocation, and application integration have not been completed.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect the authoritative Radicale CalDAV collections and the production configuration required to restore Calendar service.
  restore:
    required: true
    requirements:
      - Validate restoration of authoritative CalDAV data, Calendar configuration, and required authorization state before production or Stable approval.
  export:
    required: true
    requirements:
      - Preserve standards-based calendar export without creating a Calendar-only lock-in format.
  portability:
    required: true
    requirements:
      - Preserve CalDAV and iCalendar interoperability and validate import/export round trips before production or Stable approval.

external_dependencies:
  - name: Radicale CalDAV service
    purpose: Authoritative standards-based calendar store used for authenticated discovery, reads, and conditional writes.
    required: true
    version_constraint: null
  - name: GoreeCloud Tasks API
    purpose: Optional first-party peer integration for task projections, creation/rescheduling, and minimized Calendar busy-time context.
    required: false
    version_constraint: null

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.3.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.3.0
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence: []
  blockers:
    - Calendar has no established authoritative application release version; the Development manifest therefore records development-unversioned until a governed application version is assigned.
    - GLAZE UI V1.3 source exists, but whole-application rendered, accessibility, responsive, representative-browser/device, rollback, release, and production acceptance remain incomplete.
    - GoreeCloud Manager integration and application acceptance remain blocked.
    - Privacy Shield runtime integration and application acceptance remain blocked.
    - Wardveil Security integration and application acceptance remain blocked.
    - Everkeep backup, restore, rollback, and continuity acceptance remain blocked.
    - GoreeCloud Mesh integration and runtime acceptance remain blocked.
    - GoreeCloud Identity production integration and application acceptance remain blocked.
    - Production publication, target-environment validation, protected credentials, monitoring, release evidence, and Stable qualification remain incomplete.
