name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: calendar-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          cache: pip
      - name: Install application and security tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' pip-audit
      - name: Dependency consistency
        run: pip check
      - name: Python vulnerability audit
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          project = tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']
          requirements = list(project.get('dependencies', []))
          requirements.extend(project.get('optional-dependencies', {}).get('dev', []))
          pathlib.Path('/tmp/goreecloud-calendar-audit-requirements.txt').write_text(
              '\n'.join(requirements) + '\n', encoding='utf-8'
          )
          PY
          pip-audit --strict -r /tmp/goreecloud-calendar-audit-requirements.txt
      - name: Tests and coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
      - name: Compile source
        run: python -m compileall -q app
      - name: Build hardened image
        run: docker build -t goreecloud-calendar:test .
      - name: Verify non-root image runtime
        run: |
          test "$(docker image inspect goreecloud-calendar:test --format '{{.Config.User}}')" = "65532:65532"
      - name: Validate Compose configuration
        run: docker compose config >/dev/null
      - name: Container vulnerability and secret scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: goreecloud-calendar:test
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          scanners: vuln,secret,misconfig
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          image: goreecloud-calendar:test
          format: cyclonedx-json
          output-file: goreecloud-calendar.sbom.cdx.json
      - name: Retain SBOM evidence
        uses: actions/upload-artifact@v4
        with:
          name: goreecloud-calendar-sbom
          path: goreecloud-calendar.sbom.cdx.json
          retention-days: 30
