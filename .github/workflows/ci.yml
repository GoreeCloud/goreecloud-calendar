name: Validate Calendar

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # pinned commit
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and tests
        working-directory: backend
        run: python -m pip install ".[test]"
      - name: Compile
        working-directory: backend
        run: python -m compileall -q app
      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate JavaScript syntax
        run: node --check frontend/app.js
      - name: Assert no external frontend dependencies
        run: |
          ! grep -R -E 'https?://' frontend/index.html frontend/app.js frontend/styles.css

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build image
        run: docker build --pull=false -t goreecloud-calendar:ci .
