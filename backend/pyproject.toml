[project]
name = "goreecloud-calendar-backend"
version = "0.1.0"
description = "Native GoreeCloud Calendar application layer for Radicale CalDAV"
requires-python = ">=3.10"
dependencies = [
  "fastapi[standard]==0.139.2",
  "httpx==0.28.1",
  "icalendar==7.2.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0,<9.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
