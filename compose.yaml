services:
  calendar:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: goreecloud-calendar
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8086:8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/live', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
